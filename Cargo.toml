[package]
name = "ghostline-building-builder"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Standalone Cyberpunk 2077 building authoring and native export"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
ghostline-red = { path = "../ghostline-red" }
ghostline-renderer = { path = "../renderer" }
glam = "0.30"
geo = { version = "0.33", default-features = false, features = ["earcut"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
debug = 1
